name: Insights build check

on:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node build-insights.js

      - name: Fail if generated output is out of sync with content/
        run: |
          git diff --exit-code -- insights/ sitemap.xml || {
            echo "::error::insights/ and sitemap.xml are out of sync with content/articles/. Run 'npm run build' and commit the result.";
            exit 1;
          }
