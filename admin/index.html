<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="topbar-title"><span class="mark">OI</span> Insights Admin</div>
      <div class="git-badge">
        <span class="branch" id="git-branch">—</span>
        <span id="git-ahead"></span>
        <button class="push-btn" id="push-btn">Push now</button>
      </div>
    </div>

    <div class="body-row">
      <aside class="sidebar">
        <div class="sidebar-controls">
          <input type="text" class="search-input" id="search-input" placeholder="Search articles…">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="draft">Drafts</button>
            <button class="filter-tab" data-filter="published">Published</button>
          </div>
          <button class="new-article-btn" id="new-article-btn">+ New Article</button>
        </div>
        <div class="article-list" id="article-list"></div>
      </aside>

      <main class="main" id="main">
        <div class="empty-main" id="empty-main">Select an article, or create a new one.</div>

        <div class="editor-column" id="editor-column" style="display:none;">
          <div class="toolbar" id="toolbar">
            <button data-cmd="bold" title="Bold"><b>B</b></button>
            <button data-cmd="italic" title="Italic"><i>I</i></button>
            <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
            <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
            <span class="sep"></span>
            <button data-cmd="heading2" title="Heading">H2</button>
            <button data-cmd="heading3" title="Subheading">H3</button>
            <span class="sep"></span>
            <button data-cmd="bulletList" title="Bullet list">&bull; List</button>
            <button data-cmd="orderedList" title="Numbered list">1. List</button>
            <button data-cmd="blockquote" title="Quote">&ldquo;</button>
            <button data-cmd="codeBlock" title="Code block">{ }</button>
            <span class="sep"></span>
            <button data-cmd="link" title="Link">&#128279;</button>
            <button data-cmd="image" title="Insert image">&#128247;</button>
            <span class="sep"></span>
            <button data-cmd="undo" title="Undo">&#8630;</button>
            <button data-cmd="redo" title="Redo">&#8631;</button>
          </div>
          <div class="editor-scroll">
            <div class="editor-inner">
              <input type="text" class="title-input" id="title-input" placeholder="Untitled">
              <div id="editor-content"></div>
            </div>
          </div>
        </div>
      </main>

      <aside class="details-panel" id="details-panel" style="display:none;">
        <div class="field">
          <label>Cover image</label>
          <div class="cover-drop" id="cover-drop">Click to upload</div>
          <input type="file" id="cover-file-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <input type="file" id="body-image-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        </div>
        <div class="field">
          <label>Commercial question</label>
          <input type="text" id="field-commercial-question" placeholder="What decision does this help an operator make?">
        </div>
        <div class="field">
          <label>Summary</label>
          <textarea id="field-summary" rows="3" placeholder="One or two sentences, shown on the Insights index."></textarea>
        </div>
        <div class="field">
          <label>SEO description</label>
          <textarea id="field-seo-description" rows="3" placeholder="Meta description for search engines."></textarea>
        </div>
        <div class="field">
          <label>Keywords</label>
          <input type="text" id="field-keyword-input" placeholder="Type a keyword and press Enter">
          <div class="keywords-chips" id="keywords-chips"></div>
        </div>
        <div class="field">
          <label>LinkedIn URL (optional)</label>
          <input type="url" id="field-linkedin-url" placeholder="https://www.linkedin.com/posts/…">
        </div>

        <div class="actions">
          <div class="save-status" id="save-status"></div>
          <div class="actions-row">
            <button class="btn" id="preview-btn">Preview</button>
            <button class="btn btn-primary" id="save-btn">Save Draft</button>
          </div>
          <button class="btn btn-accent" id="publish-btn">Publish</button>
          <div class="actions-row">
            <button class="btn" id="duplicate-btn">Duplicate</button>
            <button class="btn btn-danger" id="delete-btn">Delete</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
